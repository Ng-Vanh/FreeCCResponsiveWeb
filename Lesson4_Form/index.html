<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>
</body>
<form action="https://register-demo.freecodecamp.org" method="post">
    <fieldset>
        <label for="first-name" >Enter Your First Name: <input type="text" name="" id="first-name" required></label>
        <label for="last-name">Enter Your Last Name: <input type="text" name="" id="last-name" required></label>
        <label for="email">Enter Your Email: <input type="email" name="" id="email" required></label>
        <label for="new-password">Create a New Password: <input type="password" name="" id="new-password" required pattern="[a-z0-5]{8,}"></label>
    </fieldset>
    <fieldset>
        <label for="personal-account"><input type="radio" name="account-type" id="personal-account">Personal Account</label>
        <label for="business-account"><input type="radio" name="account-type" id="business-account">Business Account</label>
        <label for="terms-and-conditions"> <input type="checkbox" name="" id="terms-and-conditions" required>I accept the <a href="https://www.freecodecamp.org/news/terms-of-service/">terms and conditions</a></label>
    </fieldset>
    <fieldset>
        <label for=""><input type="file" name="" id="">Upload a profile picture: </label>
        <label for=""><input type="number" name="" id="" min="13" max="120">Input your age (years):</label>
        <label for="">
            How did you hear about us?
            <select name="" id="">
                <option value="">(select one)</option>
                <option value="1">freeCodeCamp News</option>
                <option value="2">freeCodeCamp YouTube Channel</option>
                <option value="3">freeCodeCamp Forum</option>
                <option value="4">Other</option>
            </select>
        </label>
        <select name="" id="">
            <option value=""></option>
            <option value=""></option>
            <option value=""></option>
            <option value=""></option>
            <option value=""></option>
        </select>
    </fieldset>
    <input type="submit" name="" id="" value="Submit">
</form>
</html>
